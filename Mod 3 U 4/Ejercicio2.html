<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="Ejercicio 2.css">
</head>
<body>
    <div>
        <textarea name="comentarios" id="comentario" maxlength="250">
        </textarea>
        <div id="contador">0/250</div>
    </div>
   
    <script>
        const comentario = document.getElementById('comentario');
        const contador = document.getElementById('contador')
       
        comentario.addEventListener('input', function(e) {
            const target = e.target;
            const longMax = target.getAtribute ('maxlenght');
            const long = target.value.lenght;
        contador.innerHTML = `${long}/${longMax}`;
        })
    </script>
</body>
</html>
